version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # The test toolchain now starts at Node 22: Vitest 5, jsdom 30, and
      # jest-dom 7 all declare that floor, so the unit suite runs only on Node
      # 22 and newer. Runtime coverage on the published floor stays in ci.yml's
      # node-20-runtime job, the only Node 20 job in CI, so no major is held
      # for it.
      #
      # The node types describe the runtime floor in engines.node, so their
      # major moves only when that floor does. scripts/check-package.mjs
      # enforces the pairing.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The shared UI ships breaking changes in 0.x minors and is pinned exactly,
      # so its bump arrives alone, with the migration guide open, rather than
      # inside the weekly development batch.
      signalk-nearlcrews-ui:
        patterns: ["signalk-nearlcrews-ui"]
      dev-deps:
        dependency-type: "development"
        exclude-patterns: ["signalk-nearlcrews-ui"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    target-branch: "main"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
