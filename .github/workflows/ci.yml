name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel duplicate runs on the same ref so rapid PR pushes don't queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.22.2, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npx --yes npm@12.0.2 ci

      - name: Run linter
        run: npm run lint

      - name: Check workflow contracts
        run: npm run ci:workflows

      - name: Check for dead code
        run: npm run knip

      - name: Run type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '22.22.2'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run security audit
        if: matrix.node-version == '22.22.2'
        run: npm run security-audit

  # Blocking coverage for the published >=20.18 runtime floor. The floor is a
  # RUNTIME claim: users install the prebuilt dist, so this lane runs the
  # plugin-side suite only. The panel build chain and the DOM-environment
  # panel tests need Node 20.19 or newer (require of ES modules: babel-loader
  # loading the ESM @babel/core, and the DOM environment's ESM dependencies)
  # and are covered by the 22-plus matrix and the armv7 lane, which tracks the
  # newest Node 20. The reusable plugin-ci armv7 lane is also advisory
  # (continue-on-error), so it cannot stop a Node 20 regression; this lane can.
  # Node 20 ships npm 10, so this job deliberately uses the system npm.
  node-20-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 20.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native hooks
        run: npm rebuild

      - name: Run the plugin-side tests
        run: npx --no-install vitest run --exclude "test/configpanel/**"

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22.22.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: 'npm'

      - name: Install dependencies
        run: npx --yes npm@12.0.2 ci

      - name: Build project
        run: npm run build

      - name: Check packed package
        run: npm run package:check

      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Check build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          if [ ! -f "public/remoteEntry.js" ]; then
            echo "Build failed: public/remoteEntry.js not found"
            exit 1
          fi
          echo "Build successful: dist/index.js and public/remoteEntry.js created"
          ls -lh dist/
          ls -lh public/

      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Run configuration panel browser tests
        run: npm run test:browser:cross:built
