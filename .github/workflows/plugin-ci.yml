name: SignalK Plugin CI

# Calls the official SignalK reusable plugin-ci workflow. The community plugin
# registry (signalk.org/signalk-plugin-registry) credits a plugin only
# when a workflow run referencing
# SignalK/signalk-server/.github/workflows/plugin-ci.yml exists on the
# published version's commit; without one it applies a scoring penalty. A
# release is tagged from a main commit whose push run is already green, so that
# run is the one the registry credits and no tag trigger is needed. The
# registry reads only the newest 20 runs on that commit, and the weekly CodeQL
# and workflow security runs, plus Dependabot, keep adding runs to it while it
# stays the head of main. The weekly schedule below runs later on Monday than
# every other schedule here, so a fresh plugin CI run always sits in that window.
#
# The build, test, and Node version inputs are declared rather than inherited,
# so a change to the reusable workflow's defaults cannot silently move this
# plugin's commands or matrix. It runs npm ci, the build, the test command,
# package and lifecycle validation, and the App Store install simulation across
# Linux (x64 and arm64), macOS, and Windows on Node 22 and 24. The Node 22 lanes
# replace the bundled npm 10.9 with npm 11 before installing, and the ES2023
# syntax check on the built runtime only warns.
#
# engines.node here is >=20.18 for the Cerbo GX, but this workflow runs nothing
# on Node 20 or on 32-bit ARM: upstream removed its advisory armv7 job. The only
# Node 20 coverage in CI is ci.yml's blocking node-20-runtime job, which
# type-checks, builds the runtime artifact, and imports it on 20.18. Nothing in
# CI exercises 32-bit ARM.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@3e9924c741c8c2ac5685a5424229b0191b790e5e # master 2026-10-04
    with:
      build-command: npm run build
      test-command: npm test
      node-versions: '["22", "24"]'
