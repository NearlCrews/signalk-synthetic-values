name: SignalK Plugin CI

# Calls the official SignalK reusable plugin-ci workflow. The community plugin
# registry (signalk.org/signalk-plugin-registry) credits a plugin only
# when a workflow run referencing
# SignalK/signalk-server/.github/workflows/plugin-ci.yml exists on the
# published version's commit; without one it applies a scoring penalty. The
# tag trigger guarantees a run exists on the exact commit each release is
# published from.
#
# Every input is declared rather than inherited, so a change to the reusable
# workflow's defaults cannot silently move this plugin's matrix. It runs npm
# ci, the build, the test command, package and lifecycle validation, and the
# App Store install simulation across Linux (x64 and arm64), macOS, and Windows
# on Node 22 and 24, plus an armv7 Cerbo GX lane on Node 20 and an es-check
# es2023 gate.
#
# engines.node here is >=20.18 for the Cerbo GX, but NOTHING IN CI BLOCKS ON
# NODE 20: the armv7 job is declared `continue-on-error: true` in the reusable
# workflow, so it reports red in the job list while the overall check stays
# green, and this repository's own ci.yml matrix starts at 22.22.2. A green
# check therefore does not prove Node 20 health. That lane also can no longer
# run the unit suite: Vitest 5, jsdom 30, and jest-dom 7 all require Node 22 or
# newer, so `npm test` fails there and only the install, the build, and the
# packaging steps still say anything. The blocking defense for the published
# floor is ci.yml's node-20-runtime job, which type-checks, builds the runtime
# artifact, and imports it on 20.18. Treat the armv7 job as advisory only.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@5612cf40785f8c3be2bc918750caec163e5bd7b1 # master 2026-08-22
    with:
      build-command: npm run build
      test-command: npm test
      node-versions: '["22", "24"]'
      # True on purpose: engines.node is >=20.18 for the Cerbo GX, so the
      # advisory armv7 lane is the only place a Node 20 install is exercised.
      enable-armv7: true
