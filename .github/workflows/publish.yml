name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.4.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Verify the release tag and package.json version
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag ($TAG_NAME) does not match expected tag ($EXPECTED_TAG)" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$CHECKED_OUT_COMMIT" ]; then
            echo "Checked-out commit does not match release tag $TAG_NAME" >&2
            exit 1
          fi
      - name: Verify the release commit is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
      - run: npx --yes npm@12.0.2 ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx --yes npm@12.0.2 run verify:release
      - name: Pack the verified plugin
        run: |
          mkdir artifacts
          RELEASE_GIT_HEAD="$(git rev-parse HEAD)"
          export RELEASE_GIT_HEAD
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.gitHead=process.env.RELEASE_GIT_HEAD; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
          npx --yes npm@12.0.2 pack \
            --ignore-scripts \
            --pack-destination artifacts
          PACKED_GIT_HEAD="$(tar -xOf artifacts/*.tgz package/package.json | node -e "let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(JSON.parse(s).gitHead || ''))")"
          if [ "$PACKED_GIT_HEAD" != "$RELEASE_GIT_HEAD" ]; then
            echo "Packed gitHead ($PACKED_GIT_HEAD) does not match release commit ($RELEASE_GIT_HEAD)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: >-
          npx --yes npm@12.0.2 publish ./artifacts/*.tgz
          --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
