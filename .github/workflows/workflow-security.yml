name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check workflow syntax
        # Dependabot's github-actions ecosystem cannot see a version inside a
        # `run:` step, and there is no Go module manifest here, so nothing will tell
        # you when this ages. Bump it by hand at release time, and update the
        # matching string in scripts/check-workflows.mjs.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  # The full dependency audit includes development tools, so it runs on this
  # workflow's weekly schedule or on demand rather than gating pushes and pull
  # requests. It lives here, not in its own workflow, because the plugin
  # registry reads only the newest 20 runs on a release commit and every extra
  # scheduled workflow pushes the plugin CI run out of that window. The runtime
  # audit the registry scores still gates every push in ci.yml, and
  # npm run verify:release still runs this audit before a release.
  dependency-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Audit the complete dependency tree
        run: npx --yes npm@12.0.2 run audit:full
